<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="40mm" viewBox="0 0 150 40">
<!-- DISPLAY ONLY - not a cut file.
     The stroke is thickened, a light ground painted in, and the lightest inks
     darkened: green, cyan and orange sit below the 3:1 graphics minimum against any
     light background, so the cut order cannot be read from a faithful rendering. Hue
     and sequence are unchanged. Geometry and sheet position are untouched, and the
     CUT FILE keeps the exact values your laser keys on.
     Cut the file in the repository root, not this one. -->
  <rect x="0.0" y="0.0" width="150.0" height="40.0" fill="#ffffff"/>
<title>Buzz disc, plain bar</title>
<desc>1 user unit = 1mm. A buzz disc, plain bar, drawn by buzz_disc.rs --disc=plain-bar. Cut it in 3mm Baltic birch. Green #00ff00 cuts the two cord holes first, then black #000000 frees the part.</desc>
  <g fill="none" stroke="#0a7a12" stroke-width="0.300">
    <circle cx="62.5" cy="20" r="2.5"/>
    <circle cx="87.5" cy="20" r="2.5"/>
  </g>
  <g fill="none" stroke="#000000" stroke-width="0.300">
    <rect x="0" y="0" width="150" height="40"/>
  </g>
</svg>
